name: Open submission pull request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pull-request:
    if: >
      github.event.label.name == 'accepted' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: submission-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Require a maintainer to have applied the label
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission')
          case "$permission" in
            admin|write) echo "Accepted by $ACTOR ($permission)." ;;
            *) echo "::error::$ACTOR lacks write access; refusing to open a pull request." ; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Inspect existing submission
        id: submission
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Recheck live state after queuing: an old label event is not current consent.
          eligible=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '.state == "open" and any(.labels[]; .name == "accepted") and any(.labels[]; .name == "submission")')
          if [ "$eligible" != true ]; then
            echo "::error::Submission was closed or acceptance withdrawn; no PR will be created."
            exit 1
          fi
          branch="submission/${ISSUE_NUMBER}"
          # Qualify the head owner so a fork with the same branch name cannot match.
          # Include closed/merged PRs: retries must not reopen a rejected submission.
          pr=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f head="${GITHUB_REPOSITORY_OWNER}:$branch" \
            -f base=main -f state=all --jq '.[0].html_url // empty')
          if [ -n "$pr" ]; then
            echo "::notice::Submission already has a pull request: $pr"
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Without --exit-code, no matching branch is an empty successful result;
          # an authentication/network failure remains a failing command.
          remote=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$remote" ]; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the issue body to a file
        if: steps.submission.outputs.pr_exists != 'true' && steps.submission.outputs.branch_exists != 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/body.md"
      - name: Append the pending record
        if: steps.submission.outputs.pr_exists != 'true' && steps.submission.outputs.branch_exists != 'true'
        env:
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          pos=$(node scripts/apply-submission.mjs "$RUNNER_TEMP/body.md" "$ISSUE_URL" "$ISSUE_AUTHOR")
          echo "POS=$pos" >> "$GITHUB_ENV"
      - name: Validate the result
        if: steps.submission.outputs.pr_exists != 'true' && steps.submission.outputs.branch_exists != 'true'
        run: npm test && npm run validate
      - name: Open the pull request
        if: steps.submission.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH_EXISTS: ${{ steps.submission.outputs.branch_exists }}
        run: |
          eligible=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '.state == "open" and any(.labels[]; .name == "accepted") and any(.labels[]; .name == "submission")')
          if [ "$eligible" != true ]; then
            echo "::error::Submission was closed or acceptance withdrawn; refusing publication."
            exit 1
          fi
          gh auth setup-git --hostname github.com
          branch="submission/${ISSUE_NUMBER}"
          if [ "$BRANCH_EXISTS" != true ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -b "$branch"
            git add data/master.json
            if [ -f "submissions/${ISSUE_NUMBER}/dd.md" ]; then
              git add -- "submissions/${ISSUE_NUMBER}/dd.md"
            fi
            git commit -m "data: add pending community record no. ${POS} (closes #${ISSUE_NUMBER})"
            git push --set-upstream origin "$branch"
          fi
          gh pr create \
            --head "$branch" \
            --title "Add pending community submission #${ISSUE_NUMBER}" \
            --body "Automated submission PR for #${ISSUE_NUMBER}. Review the diff: accepting a pending record does not rate or endorse the work. A maintainer must review and sign the generated commit and start CI as described in CONTRIBUTING.md. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --base main
